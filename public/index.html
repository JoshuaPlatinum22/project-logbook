<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Logbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-pane logbook. Shelf of projects on the left, the open project's bookmark + log on the right; stacks on phones. */
:root {
  --bg: #f3f5f9;
  --surface: #ffffff;
  --sunk: #e8ecf3;
  --fg: #18202e;
  --muted: #5d6779;
  --line: #d6dce7;
  --accent: #2f55d4;
  --accent-soft: #e3e9fb;
  --ribbon: #e0a526;
  --ok: #23845a; --ok-bg: #dff2e8;
  --warn: #9a6a06; --warn-bg: #fbefd2;
  --bad: #b8382e; --bad-bg: #f8e1de;
  --idle: #5d6779; --idle-bg: #e8ecf3;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --surface: #181e29; --sunk: #0d1118; --fg: #e6eaf2; --muted: #96a0b3; --line: #2a3242;
    --accent: #7d9bff; --accent-soft: #1f2a4a; --ribbon: #f0b93f;
    --ok: #5fd39c; --ok-bg: #173527; --warn: #f0c35a; --warn-bg: #3a2e12; --bad: #ff8a7f; --bad-bg: #3d1d1a; --idle: #96a0b3; --idle-bg: #232a38;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #181e29; --sunk: #0d1118; --fg: #e6eaf2; --muted: #96a0b3; --line: #2a3242;
  --accent: #7d9bff; --accent-soft: #1f2a4a; --ribbon: #f0b93f;
  --ok: #5fd39c; --ok-bg: #173527; --warn: #f0c35a; --warn-bg: #3a2e12; --bad: #ff8a7f; --bad-bg: #3d1d1a; --idle: #96a0b3; --idle-bg: #232a38;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
body { background: var(--bg); color: var(--fg); font: 15px/1.5 var(--body); }
.wrap { max-width: 1120px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
h1 { font: 700 clamp(26px, 4vw, 34px)/1.1 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; }
.sync { font: 12px var(--mono); color: var(--muted); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
:root[data-theme="dark"] .btn.primary { color: #0b1020; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #0b1020; } }
.btn.danger { color: var(--bad); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); padding: 6px 8px; }
.btn.ghost:hover { color: var(--fg); }
.btn:disabled { opacity: .5; cursor: default; }

.grid { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 760px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Shelf */
.shelf { display: flex; flex-direction: column; gap: 12px; }
.newform { display: flex; gap: 8px; }
.newform input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.chipbtn { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; color: var(--muted); }
.chipbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.list { display: flex; flex-direction: column; gap: 2px; list-style: none; margin: 0; padding: 0; }
.item { width: 100%; text-align: left; border: 0; background: transparent; padding: 10px 12px; border-radius: 8px; display: grid; gap: 3px; }
.item:hover { background: var(--sunk); }
.item[aria-current="true"] { background: var(--surface); box-shadow: 0 0 0 1px var(--line); }
.item .name { font-weight: 600; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.item .name span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .peek { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.item .when { font: 11.5px var(--mono); color: var(--muted); }
.empty-shelf { color: var(--muted); font-size: 14px; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; }

.pill { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; flex: none; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-active { color: var(--ok); background: var(--ok-bg); }
.s-paused { color: var(--warn); background: var(--warn-bg); }
.s-blocked { color: var(--bad); background: var(--bad-bg); }
.s-done { color: var(--idle); background: var(--idle-bg); }

/* Detail */
.detail { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 24px; min-width: 0; display: flex; flex-direction: column; gap: 22px; }
.dhead { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.titleinput { font: 700 26px/1.2 var(--display); letter-spacing: -0.015em; border: 0; background: transparent; padding: 2px 0; flex: 1 1 240px; min-width: 0; border-bottom: 1px solid transparent; }
.titleinput:hover, .titleinput:focus { border-bottom-color: var(--line); outline: none; }
.dmeta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
select { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.label { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.label .hint { font: 11.5px var(--mono); letter-spacing: 0; text-transform: none; font-weight: 400; }

.bookmark { position: relative; background: var(--accent-soft); border-radius: 10px; padding: 16px 16px 14px 34px; }
.bookmark::before { content: ""; position: absolute; left: 12px; top: 0; width: 12px; height: 26px; background: var(--ribbon);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 76%, 0 100%); }
.bookmark textarea { width: 100%; border: 0; background: transparent; resize: vertical; min-height: 70px; font-size: 16px; line-height: 1.55; }
.bookmark textarea:focus { outline: none; }

.taskform { display: flex; gap: 8px; margin-bottom: 6px; }
.taskform input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 12px; }
.progress { height: 4px; background: var(--sunk); border-radius: 999px; overflow: hidden; margin: -2px 0 10px; }
.progress span { display: block; height: 100%; background: var(--ok); border-radius: inherit; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: start; padding: 7px 4px; border-radius: 6px; }
.task:hover { background: var(--sunk); }
.task input[type=checkbox] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--ok); cursor: pointer; }
.task label { overflow-wrap: anywhere; cursor: pointer; }
.task.done label { color: var(--muted); text-decoration: line-through; }
.task .btn.ghost { font-size: 12.5px; opacity: 0; padding: 0 6px; }
.task:hover .btn.ghost, .task .btn.ghost:focus-visible { opacity: 1; }
@media (hover: none) { .task .btn.ghost { opacity: 1; } }
.donehead { font: 11.5px var(--mono); color: var(--muted); padding: 10px 4px 2px; }
.notasks { color: var(--muted); font-size: 14px; padding: 4px; }
.composer { display: grid; gap: 8px; }
.composer textarea { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; min-height: 76px; resize: vertical; }
.composer .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.kbd { font: 11.5px var(--mono); color: var(--muted); }

.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.entry { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; gap: 14px; padding: 12px 0; border-top: 1px solid var(--line); align-items: start; }
.entry time { font: 12px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.entry p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.entry .btn.ghost { font-size: 12.5px; opacity: 0; }
.entry:hover .btn.ghost, .entry .btn.ghost:focus-visible { opacity: 1; }
@media (hover: none) { .entry .btn.ghost { opacity: 1; } }
@media (max-width: 480px) { .entry { grid-template-columns: minmax(0, 1fr) auto; } .entry time { grid-column: 1 / -1; } }
.nolog { color: var(--muted); font-size: 14px; }

.foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 14px; font: 12px var(--mono); color: var(--muted); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font: 13px var(--body); color: var(--fg); }

.welcome { text-align: left; }
.welcome h2 { font: 700 22px/1.2 var(--display); margin: 0 0 8px; }
.welcome p { color: var(--muted); max-width: 52ch; margin: 0 0 6px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 14px; font-size: 14px; margin-bottom: 16px; }
@media (prefers-reduced-motion: no-preference) { .item, .btn { transition: background .12s, border-color .12s; } }
</style>
</head><body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Project Logbook</h1>
      <p class="sub">Every project you're juggling, and exactly where you left each one.</p>
    </div>
    <span class="sync" id="sync">Connecting…</span>
  </header>

  <div class="notice" id="notice" hidden></div>

  <div class="grid">
    <aside class="shelf">
      <form class="newform" id="newform">
        <label for="newname" class="visually-hidden" hidden>New project name</label>
        <input id="newname" placeholder="New project name" autocomplete="off" maxlength="120">
        <button class="btn primary" type="submit" id="addbtn">Add</button>
      </form>
      <div class="filters" role="group" aria-label="Filter by status" id="filters"></div>
      <ul class="list" id="list"></ul>
    </aside>

    <main class="detail" id="detail">
      <div class="welcome">
        <h2>Loading your projects…</h2>
        <p>Your projects and notes will appear here.</p>
      </div>
    </main>
  </div>
</div>
<script>
const STATUSES = [
  { id: "active", label: "Active" },
  { id: "paused", label: "Paused" },
  { id: "blocked", label: "Blocked" },
  { id: "done", label: "Done" },
];
const STATUS_RANK = { active: 0, blocked: 1, paused: 2, done: 3 };
const state = { projects: [], selected: null, filter: "open", canWrite: true, loaded: false, confirmDelete: false };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

try { const f = localStorage.getItem("pl-filter"); if (f) state.filter = f; } catch (e) {}
try { const s = localStorage.getItem("pl-selected"); if (s) state.selected = s; } catch (e) {}

function ago(ts) {
  if (!ts) return "";
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return "just now";
  const m = Math.round(s / 60); if (m < 60) return m + "m ago";
  const h = Math.round(m / 60); if (h < 24) return h + "h ago";
  const d = Math.round(h / 24); if (d < 14) return d + "d ago";
  return new Date(ts).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" });
}
function stamp(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString(undefined, { day: "numeric", month: "short" }) + "\n" + d.toLocaleTimeString(undefined, { hour: "2-digit", minute: "2-digit" });
}
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function visible() {
  return state.projects
    .filter(p => state.filter === "all" ? true : state.filter === "open" ? p.status !== "done" : p.status === state.filter)
    .sort((a, b) => (STATUS_RANK[a.status] ?? 9) - (STATUS_RANK[b.status] ?? 9) || (b.updatedAt || 0) - (a.updatedAt || 0));
}
function current() { return state.projects.find(p => p.id === state.selected) || null; }

function renderFilters() {
  const opts = [{ id: "open", label: "In progress" }, ...STATUSES.filter(s => s.id !== "active"), { id: "all", label: "All" }];
  $("filters").innerHTML = opts.map(o => {
    const n = o.id === "all" ? state.projects.length : o.id === "open" ? state.projects.filter(p => p.status !== "done").length : state.projects.filter(p => p.status === o.id).length;
    return `<button class="chipbtn" data-f="${o.id}" aria-pressed="${state.filter === o.id}">${o.label} ${n}</button>`;
  }).join("");
}

function renderList() {
  const items = visible();
  if (!state.loaded) { $("list").innerHTML = ""; return; }
  if (!items.length) {
    $("list").innerHTML = `<li class="empty-shelf">${state.projects.length ? "No projects with this status." : "No projects yet. Type a name above and press Add."}</li>`;
    return;
  }
  $("list").innerHTML = items.map(p => {
    const st = STATUSES.find(s => s.id === p.status) || STATUSES[0];
    const peek = p.upTo ? p.upTo.split("\n")[0] : "No bookmark yet";
    return `<li><button class="item" data-id="${esc(p.id)}" aria-current="${p.id === state.selected}">
      <span class="name"><span>${esc(p.name)}</span><span class="pill s-${st.id}">${st.label}</span></span>
      <span class="peek">${esc(peek)}</span>
      <span class="when">${(() => { const t = p.tasks || [], left = t.filter(x => !x.done).length; return t.length ? (left ? left + " task" + (left === 1 ? "" : "s") + " left · " : "all tasks done · ") : ""; })()}touched ${ago(p.updatedAt)}</span>
    </button></li>`;
  }).join("");
}

function renderDetail() {
  const el = $("detail");
  const p = current();
  if (!state.loaded) return;
  if (!p) {
    el.innerHTML = `<div class="welcome"><h2>${state.projects.length ? "Pick a project" : "Start your first project"}</h2>
      <p>${state.projects.length ? "Choose a project from the list to see where you're up to and add notes." : "Add a project on the left. Each one gets a bookmark for where you're up to, a task list, and a dated log of notes."}</p></div>`;
    return;
  }
  const notes = (p.notes || []).slice().sort((a, b) => b.at - a.at);
  const ro = state.canWrite ? "" : "disabled";
  const tasks = p.tasks || [];
  const openT = tasks.filter(t => !t.done), doneT = tasks.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  const taskRow = t => `<li class="task${t.done ? " done" : ""}">
      <input type="checkbox" id="t-${esc(t.id)}" data-task-toggle="${esc(t.id)}" ${t.done ? "checked" : ""} ${ro}>
      <label for="t-${esc(t.id)}">${esc(t.text)}</label>
      ${state.canWrite ? `<button class="btn ghost" data-del-task="${esc(t.id)}" aria-label="Delete task">Delete</button>` : "<span></span>"}</li>`;
  el.innerHTML = `
    <div class="dhead">
      <input class="titleinput" id="title" value="${esc(p.name)}" aria-label="Project name" maxlength="120" ${ro}>
      <div class="dmeta">
        <label for="status" hidden>Status</label>
        <select id="status" ${ro}>${STATUSES.map(s => `<option value="${s.id}" ${s.id === p.status ? "selected" : ""}>${s.label}</option>`).join("")}</select>
      </div>
    </div>
    <section>
      <p class="label"><span>Where I'm up to</span><span class="hint" id="savehint">${p.upToAt ? "updated " + ago(p.upToAt) : ""}</span></p>
      <div class="bookmark"><textarea id="upto" placeholder="e.g. Finished the login screen. Next: hook up password reset." ${ro}>${esc(p.upTo || "")}</textarea></div>
    </section>
    <section>
      <p class="label"><span>Tasks</span><span class="hint">${tasks.length ? doneT.length + " of " + tasks.length + " done" : ""}</span></p>
      ${tasks.length ? `<div class="progress" aria-hidden="true"><span style="width:${Math.round(doneT.length / tasks.length * 100)}%"></span></div>` : ""}
      <form class="taskform" id="taskform">
        <label for="task" hidden>New task</label>
        <input id="task" placeholder="Add a task, e.g. Write the pricing page copy" autocomplete="off" maxlength="500" ${ro}>
        <button class="btn primary" type="submit" ${ro}>Add task</button>
      </form>
      <ul class="tasks">
        ${openT.map(taskRow).join("") || (tasks.length ? "" : `<li class="notasks">No tasks yet. Break the project into steps and tick them off as you go.</li>`)}
        ${doneT.length ? `<li class="donehead">Done</li>` + doneT.map(taskRow).join("") : ""}
      </ul>
    </section>
    <section>
      <p class="label"><span>Notes</span><span class="hint">${notes.length} ${notes.length === 1 ? "entry" : "entries"}</span></p>
      <form class="composer" id="composer">
        <label for="note" hidden>New note</label>
        <textarea id="note" placeholder="What did you do, decide, or get stuck on?" ${ro}></textarea>
        <div class="row"><span class="kbd">Ctrl/⌘ + Enter to add</span><button class="btn primary" type="submit" ${ro}>Add note</button></div>
      </form>
    </section>
    <ul class="log">${notes.length ? notes.map(n => `
      <li class="entry"><time datetime="${new Date(n.at).toISOString()}">${esc(stamp(n.at)).replace("\n", "<br>")}</time>
        <p>${esc(n.text)}</p>
        ${state.canWrite ? `<button class="btn ghost" data-del-note="${esc(n.id)}" aria-label="Delete note">Delete</button>` : "<span></span>"}</li>`).join("")
      : `<li class="nolog">No notes yet. Your log will build up here, newest first.</li>`}</ul>
    <div class="foot">
      <span>started ${p.createdAt ? new Date(p.createdAt).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "—"}</span>
      ${state.canWrite ? (state.confirmDelete
        ? `<span class="confirm">Delete “${esc(p.name)}” and all its tasks and notes? <button class="btn danger" id="delyes">Delete project</button><button class="btn" id="delno">Keep it</button></span>`
        : `<button class="btn ghost" id="delproj">Delete project</button>`) : ""}
    </div>`;
}

function render() { renderFilters(); renderList(); renderDetail(); }

function select(id) {
  state.selected = id; state.confirmDelete = false;
  try { localStorage.setItem("pl-selected", id || ""); } catch (e) {}
  render();
}

function notice(msg) { const n = $("notice"); n.textContent = msg || ""; n.hidden = !msg; }

// --- storage: the server keeps projects in a JSON file ---
const api = {
  async list() { const r = await fetch("/api/projects", { cache: "no-store" }); if (!r.ok) throw r; return r.json(); },
  async put(p) { const r = await fetch("/api/projects/" + encodeURIComponent(p.id), { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(p) }); if (!r.ok) throw r; },
  async del(id) { const r = await fetch("/api/projects/" + encodeURIComponent(id), { method: "DELETE" }); if (!r.ok) throw r; },
};
let chain = Promise.resolve();
function write(fn) {
  $("sync").textContent = "Saving…";
  chain = chain.then(fn).then(() => { $("sync").textContent = "Saved"; notice(""); }).catch(() => {
    $("sync").textContent = "Not saved";
    notice("That change didn't save. Check your connection and try again.");
  });
  return chain;
}
function patch(id, fields) {
  const p = state.projects.find(x => x.id === id); if (!p) return;
  Object.assign(p, fields, { updatedAt: Date.now() });
  const copy = JSON.parse(JSON.stringify(p));
  refresh();
  return write(() => api.put(copy));
}
function refresh() { applySnapshot(state.projects); }

// --- events ---
$("filters").addEventListener("click", e => {
  const b = e.target.closest("[data-f]"); if (!b) return;
  state.filter = b.dataset.f; try { localStorage.setItem("pl-filter", state.filter); } catch (er) {}
  render();
});
$("list").addEventListener("click", e => { const b = e.target.closest("[data-id]"); if (b) select(b.dataset.id); });

$("newform").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("newname").value.trim();
  if (!name) return;
  const id = uid(), now = Date.now();
  const body = { name, status: "active", upTo: "", upToAt: 0, tasks: [], notes: [], createdAt: now, updatedAt: now };
  $("newname").value = "";
  if (state.filter === "done" || state.filter === "paused" || state.filter === "blocked") state.filter = "open";
  state.projects.push({ id, ...body });
  write(() => api.put({ id, ...body }));
  select(id);
  setTimeout(() => $("upto")?.focus(), 50);
});

let upToTimer = null;
const detail = $("detail");
detail.addEventListener("input", e => {
  const p = current(); if (!p) return;
  if (e.target.id === "upto") {
    $("savehint").textContent = "editing…";
    clearTimeout(upToTimer);
    const id = p.id, val = e.target.value;
    upToTimer = setTimeout(() => { $("savehint") && ($("savehint").textContent = "saved"); patch(id, { upTo: val, upToAt: Date.now() }); }, 700);
  }
});
detail.addEventListener("change", e => {
  const p = current(); if (!p) return;
  const tog = e.target.closest("[data-task-toggle]");
  if (tog) {
    const done = tog.checked;
    patch(p.id, { tasks: (p.tasks || []).map(t => t.id === tog.dataset.taskToggle ? { ...t, done, doneAt: done ? Date.now() : 0 } : t) });
    return;
  }
  if (e.target.id === "status") patch(p.id, { status: e.target.value });
  if (e.target.id === "title") { const v = e.target.value.trim(); if (v && v !== p.name) patch(p.id, { name: v }); else e.target.value = p.name; }
});
detail.addEventListener("keydown", e => {
  if (e.target.id === "note" && e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("composer").requestSubmit(); }
  if (e.target.id === "title" && e.key === "Enter") e.target.blur();
});
detail.addEventListener("submit", e => {
  if (e.target.id === "taskform") {
    e.preventDefault();
    const p = current(); const text = $("task").value.trim();
    if (!p || !text) return;
    $("task").value = "";
    patch(p.id, { tasks: [...(p.tasks || []), { id: uid(), text, done: false, at: Date.now(), doneAt: 0 }] });
    return;
  }
  if (e.target.id !== "composer") return;
  e.preventDefault();
  const p = current(); const text = $("note").value.trim();
  if (!p || !text) return;
  const notes = [...(p.notes || []), { id: uid(), text, at: Date.now() }];
  $("note").value = "";
  patch(p.id, { notes });
});
detail.addEventListener("click", e => {
  const p = current(); if (!p) return;
  const del = e.target.closest("[data-del-note]");
  const delT = e.target.closest("[data-del-task]");
  if (delT) { patch(p.id, { tasks: (p.tasks || []).filter(t => t.id !== delT.dataset.delTask) }); return; }
  if (del) { patch(p.id, { notes: (p.notes || []).filter(n => n.id !== del.dataset.delNote) }); return; }
  if (e.target.id === "delproj") { state.confirmDelete = true; renderDetail(); return; }
  if (e.target.id === "delno") { state.confirmDelete = false; renderDetail(); return; }
  if (e.target.id === "delyes") {
    const id = p.id;
    state.projects = state.projects.filter(x => x.id !== id);
    write(() => api.del(id));
    select(null);
  }
});

// Re-render on snapshot without clobbering text the user is typing.
function applySnapshot(docs) {
  state.projects = docs;
  state.loaded = true;
  if (state.selected && !current()) state.selected = null;
  if (!state.selected) { const v = visible(); if (v.length && window.innerWidth > 760) state.selected = v[0].id; }
  const a = document.activeElement;
  const typing = a && detail.contains(a) && (a.id === "upto" || a.id === "note" || a.id === "title" || a.id === "task");
  renderFilters(); renderList();
  if (typing) {
    const keep = { id: a.id, value: a.value, s: a.selectionStart, e: a.selectionEnd };
    renderDetail();
    const el = $(keep.id);
    if (el) { el.value = keep.value; el.focus(); try { el.setSelectionRange(keep.s, keep.e); } catch (er) {} }
  } else renderDetail();
}

setInterval(() => { if (state.loaded) renderList(); }, 60000);

async function load() {
  try {
    const list = await api.list();
    $("sync").textContent = "Saved";
    applySnapshot(list);
  } catch (e) {
    $("sync").textContent = "Not connected";
    state.loaded = true; render();
    notice("Couldn't load your projects. Reload the page to try again.");
  }
}
// Pick up changes made on another device when you come back to this tab.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") chain.then(load); });
render();
load();
</script>
</body></html>
